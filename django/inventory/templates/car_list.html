<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <title>TurboCar — Maşınlar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f2f2f2; padding: 20px; }

    header {
      background: #0b3d91;
      color: white;
      padding: 16px 0;
      margin: -20px -20px 24px -20px;
      text-align: center;
    }
    header h1 { font-size: 26px; }
    header h1 span { color: #ffce00; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      transition: transform .15s, box-shadow .15s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }

    .card-img {
      width: 100%;
      height: 160px;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 13px;
      overflow: hidden;
    }
    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body { padding: 12px; }
    .card-body h3 {
      font-size: 16px;
      margin-bottom: 6px;
      color: #222;
    }
    .price {
      color: #c8102e;
      font-weight: bold;
      font-size: 18px;
      margin: 6px 0;
    }
    .meta {
      font-size: 13px;
      color: #555;
      line-height: 1.5;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 60px 20px;
      grid-column: 1 / -1;
    }

    a.card-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <h1>Turbo<span>Car</span></h1>
  </header>

  <div class="grid">
    {% for car in cars %}
      <a class="card-link" href="{% url 'car_detail' car.pk %}">
        <div class="card">
          <div class="card-img">
            {% if car.image %}
              <img src="{{ car.image.url }}" alt="{{ car }}">
            {% else %}
              Şəkil yoxdur
            {% endif %}
          </div>
          <div class="card-body">
            <h3>{{ car.brand }} {{ car.model }}</h3>
            <div class="price">{{ car.price }} AZN</div>
            <div class="meta">
              {{ car.year }} • {{ car.mileage }} km<br>
              📍 {{ car.city }}<br>
              📞 {{ car.phone }}
            </div>
          </div>
        </div>
      </a>
    {% empty %}
      <div class="empty">
        <h3>Hələ maşın yoxdur</h3>
        <p>Admin paneldən maşın əlavə et: <a href="/admin/">/admin/</a></p>
      </div>
    {% endfor %}
  </div>

</body>
</html>
